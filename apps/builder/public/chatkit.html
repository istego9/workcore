<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ChatKit Local</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Inter", system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      body.embedded {
        background: #ffffff;
      }
      body.embedded header {
        padding: 0;
        border: none;
        background: transparent;
      }
      body.embedded .bar {
        display: none;
      }
      body.embedded .status {
        padding: 8px 12px;
      }
      body.embedded main {
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
      }
      .bar {
        display: grid;
        grid-template-columns: repeat(9, minmax(120px, 1fr)) auto;
        gap: 10px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5f5;
        background: #fff;
        font-size: 14px;
      }
      button {
        padding: 10px 14px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        font-size: 12px;
        color: #64748b;
        padding-top: 6px;
      }
      main {
        flex: 1;
        min-height: 0;
      }
      openai-chatkit {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div>
          <label for="apiUrl">API URL</label>
          <input id="apiUrl" placeholder="auto" />
        </div>
        <div>
          <label for="domainKey">Domain key</label>
          <input id="domainKey" placeholder="ck_domain_key..." />
        </div>
        <div>
          <label for="workflowId">Workflow ID</label>
          <input id="workflowId" placeholder="wf_..." />
        </div>
        <div>
          <label for="workflowVersionId">Workflow version</label>
          <input id="workflowVersionId" placeholder="optional" />
        </div>
        <div>
          <label for="projectId">Project ID</label>
          <input id="projectId" placeholder="optional" />
        </div>
        <div>
          <label for="tenantId">Tenant ID</label>
          <input id="tenantId" placeholder="local" />
        </div>
        <div>
          <label for="authToken">Auth token</label>
          <input id="authToken" type="password" placeholder="optional" />
        </div>
        <div>
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <div>
          <label for="autoConnect">Auto connect</label>
          <select id="autoConnect">
            <option value="0">Off</option>
            <option value="1">On</option>
          </select>
        </div>
        <button id="apply">Connect</button>
      </div>
      <div class="status" id="status">Idle</div>
    </header>
    <main>
      <openai-chatkit id="chatkit"></openai-chatkit>
    </main>

    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>
    <script>
      const chatkitEl = document.getElementById('chatkit');
      const statusEl = document.getElementById('status');

      const apiUrlInput = document.getElementById('apiUrl');
      const domainKeyInput = document.getElementById('domainKey');
      const workflowIdInput = document.getElementById('workflowId');
      const workflowVersionIdInput = document.getElementById('workflowVersionId');
      const projectIdInput = document.getElementById('projectId');
      const tenantIdInput = document.getElementById('tenantId');
      const authTokenInput = document.getElementById('authToken');
      const themeSelect = document.getElementById('theme');
      const autoConnectSelect = document.getElementById('autoConnect');
      const applyBtn = document.getElementById('apply');

      const params = new URLSearchParams(window.location.search);
      const embed = params.get('embed') === '1';
      const autoStartEnabled = params.get('auto_start') === '1';
      let autoStartTriggered = false;

      function inferRootHost(hostname) {
        if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1') {
          return 'localhost';
        }
        if (hostname.startsWith('builder.')) return hostname.slice('builder.'.length);
        if (hostname.startsWith('api.')) return hostname.slice('api.'.length);
        if (hostname.startsWith('chatkit.')) return hostname.slice('chatkit.'.length);
        return hostname;
      }

      function inferDefaultApiUrl() {
        const rootHost = inferRootHost(window.location.hostname);
        const apiHost = rootHost === 'localhost' ? 'api.localhost' : `api.${rootHost}`;
        const port = window.location.port ? `:${window.location.port}` : '';
        return `${window.location.protocol}//${apiHost}${port}/chat`;
      }

      const defaultApiUrl = inferDefaultApiUrl();
      if (embed) {
        document.body.classList.add('embedded');
      }
      apiUrlInput.placeholder = defaultApiUrl;
      apiUrlInput.value = params.get('api_url') || defaultApiUrl;
      domainKeyInput.value = params.get('domain_key') || '';
      workflowIdInput.value = params.get('workflow_id') || '';
      workflowVersionIdInput.value = params.get('workflow_version_id') || '';
      projectIdInput.value = params.get('project_id') || '';
      tenantIdInput.value = params.get('tenant_id') || 'local';
      authTokenInput.value = params.get('auth_token') || '';
      themeSelect.value = params.get('theme') || 'light';
      autoConnectSelect.value = params.get('auto') || '0';
      if (embed) {
        autoConnectSelect.value = '1';
      }

      function setStatus(text, tone) {
        statusEl.textContent = text;
        statusEl.style.color = tone === 'error' ? '#dc2626' : '#64748b';
      }

      function createRequestId(prefix) {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
          return `${prefix}_${globalThis.crypto.randomUUID()}`;
        }
        return `${prefix}_${Math.random().toString(36).slice(2, 12)}`;
      }

      function normalizeChatApiUrl(rawUrl) {
        try {
          const parsed = new URL(rawUrl);
          const aliasPattern = /\/chatkit\/?$/i;
          if (!aliasPattern.test(parsed.pathname)) {
            return { url: parsed.toString(), rewritten: false };
          }
          parsed.pathname = parsed.pathname.replace(aliasPattern, '/chat');
          return { url: parsed.toString(), rewritten: true };
        } catch (err) {
          const normalized = String(rawUrl || '').replace(/\/chatkit\/?$/i, '/chat');
          return { url: normalized, rewritten: normalized !== rawUrl };
        }
      }

      function fetchJson(url) {
        return fetch(url, { headers: { Accept: 'application/json' } })
          .then((response) => {
            if (!response.ok) return null;
            return response.json();
          })
          .catch(() => null);
      }

      async function bootstrapIntegration(apiURL, projectId) {
        let resolvedApiUrl = apiURL;
        let doctorStatus = 'UNKNOWN';
        let doctorFailChecks = [];
        let warnings = [];
        let capabilities = null;

        let parsed = null;
        try {
          parsed = new URL(apiURL);
        } catch (err) {
          warnings.push('invalid_api_url');
          return { resolvedApiUrl, doctorStatus, doctorFailChecks, warnings, capabilities };
        }

        const apiBase = new URL(parsed.toString());
        apiBase.search = '';
        apiBase.hash = '';
        if (/\/chatkit\/?$/i.test(apiBase.pathname) || /\/chat\/?$/i.test(apiBase.pathname)) {
          apiBase.pathname = apiBase.pathname.replace(/\/(chatkit|chat)\/?$/i, '/');
        }
        if (!apiBase.pathname.endsWith('/')) {
          apiBase.pathname = `${apiBase.pathname}/`;
        }

        const kit = await fetchJson(new URL('agent-integration-kit.json', apiBase).toString());
        const manifest = kit?.integration_manifest || null;
        const capabilitiesUrl =
          manifest?.integration_capabilities_url ||
          kit?.urls?.integration_capabilities ||
          new URL('integration-capabilities', apiBase).toString();
        capabilities = await fetchJson(capabilitiesUrl);
        if (!capabilities) {
          warnings.push('integration_capabilities_unavailable');
        }
        const doctorBaseUrl = kit?.urls?.integration_test_json || new URL('agent-integration-test.json', apiBase).toString();
        const doctorUrl = new URL(doctorBaseUrl);
        if (projectId) {
          doctorUrl.searchParams.set('project_id', projectId);
        }
        const doctor = await fetchJson(doctorUrl.toString());

        const canonicalPath =
          capabilities?.chat?.canonical_endpoint ||
          (() => {
            try {
              return new URL(manifest?.chat_api_url || '').pathname;
            } catch (err) {
              return '/chat';
            }
          })();
        const hostPolicy = manifest?.host_policy || null;
        const enforcePinned = hostPolicy?.mode === 'pinned' && hostPolicy?.enforcement === 'required';
        if (enforcePinned) {
          try {
            const canonicalBase = new URL(hostPolicy.canonical_base_url || manifest?.api_base_url || '');
            parsed.protocol = canonicalBase.protocol;
            parsed.hostname = canonicalBase.hostname;
            parsed.port = canonicalBase.port;
            warnings.push(`host_policy_enforced:${hostPolicy.policy_id || 'pinned'}`);
          } catch (err) {
            warnings.push('host_policy_enforcement_failed');
          }
        }
        parsed.pathname = canonicalPath.startsWith('/') ? canonicalPath : `/${canonicalPath || 'chat'}`;
        resolvedApiUrl = parsed.toString();

        const summaryStatus = doctor?.summary?.status;
        const checks = Array.isArray(doctor?.checks) ? doctor.checks : [];
        doctorFailChecks = checks.filter((item) => item?.status === 'FAIL').map((item) => item?.id || item?.code || 'doctor_fail');
        if (summaryStatus === 'PASS' || summaryStatus === 'WARN' || summaryStatus === 'FAIL') {
          doctorStatus = summaryStatus;
        } else if (doctorFailChecks.length) {
          doctorStatus = 'FAIL';
        }

        return { resolvedApiUrl, doctorStatus, doctorFailChecks, warnings, capabilities };
      }

      function buildFetch(apiURL, authToken, workflowId, workflowVersionId, projectId, tenantId) {
        return async (input, init = {}) => {
          const normalized = normalizeChatApiUrl(apiURL);
          if (normalized.rewritten) {
            window.dispatchEvent(
              new CustomEvent('workcore.integration.legacy_chat_alias_used', {
                detail: {
                  original_url: apiURL,
                  resolved_url: normalized.url,
                  observed_at: new Date().toISOString(),
                },
              }),
            );
            console.warn('[chatkit.html] legacy /chatkit alias rewritten', {
              original_url: apiURL,
              resolved_url: normalized.url,
            });
          }

          const headers = new Headers(init.headers || {});
          if (!headers.has('Content-Type')) {
            headers.set('Content-Type', 'application/json');
          }
          headers.set('X-Tenant-Id', tenantId || 'local');
          headers.set('X-Correlation-Id', createRequestId('corr'));
          headers.set('X-Trace-Id', createRequestId('trace'));
          if (projectId) {
            headers.set('X-Project-Id', projectId);
          }
          if (authToken) {
            headers.set('Authorization', `Bearer ${authToken}`);
          }

          let body = init.body;
          if (body && typeof body === 'string') {
            try {
              const parsed = JSON.parse(body);
              if (parsed && typeof parsed === 'object' && parsed.type === 'threads.create') {
                parsed.metadata = parsed.metadata || {};
                if (workflowId) parsed.metadata.workflow_id = workflowId;
                if (workflowVersionId) parsed.metadata.workflow_version_id = workflowVersionId;
                if (projectId) parsed.metadata.project_id = projectId;
                body = JSON.stringify(parsed);
              }
            } catch (err) {
              // ignore parse errors
            }
          }

          const nextInit = Object.assign({}, init, { headers, body });
          return fetch(normalized.url, nextInit);
        };
      }

      async function connect() {
        const apiURL = apiUrlInput.value.trim();
        const domainKey = domainKeyInput.value.trim();
        const workflowId = workflowIdInput.value.trim();
        const workflowVersionId = workflowVersionIdInput.value.trim();
        const projectId = projectIdInput.value.trim();
        const tenantId = tenantIdInput.value.trim() || 'local';
        const authToken = authTokenInput.value.trim();
        const theme = themeSelect.value;

        if (!apiURL) {
          setStatus('API URL is required', 'error');
          return;
        }
        if (!domainKey) {
          setStatus('Domain key is required', 'error');
          return;
        }
        if (!workflowId && !projectId) {
          setStatus('Workflow ID or Project ID is required', 'error');
          return;
        }

        const bootstrap = await bootstrapIntegration(apiURL, projectId);
        if (bootstrap.resolvedApiUrl && bootstrap.resolvedApiUrl !== apiURL) {
          apiUrlInput.value = bootstrap.resolvedApiUrl;
        }
        if (bootstrap.doctorFailChecks.length || bootstrap.doctorStatus === 'FAIL') {
          setStatus(`Integration doctor FAIL: ${bootstrap.doctorFailChecks.join(', ') || 'check report'}`, 'error');
          return;
        }

        try {
          chatkitEl.setOptions({
            api: {
              url: bootstrap.resolvedApiUrl || apiURL,
              domainKey,
              fetch: buildFetch(
                bootstrap.resolvedApiUrl || apiURL,
                authToken,
                workflowId,
                workflowVersionId,
                projectId,
                tenantId,
              ),
            },
            theme,
          });
          if (bootstrap.doctorStatus === 'WARN') {
            setStatus('Connected (integration doctor WARN). Start chatting.', 'ok');
          } else if (bootstrap.warnings.length) {
            setStatus(`Connected (${bootstrap.warnings.join(', ')}). Start chatting.`, 'ok');
          } else {
            setStatus('Connected. Start chatting.', 'ok');
          }
        } catch (err) {
          setStatus(`Failed to connect: ${err.message || err}`, 'error');
        }
      }

      function triggerAutoStart() {
        if (!autoStartEnabled || autoStartTriggered) return;
        if (typeof chatkitEl.sendUserMessage !== 'function') {
          setStatus('Auto-start failed: sendUserMessage unavailable', 'error');
          autoStartTriggered = true;
          return;
        }
        autoStartTriggered = true;
        const ignoreAlreadyResponding = (err) => {
          const message = err?.message || String(err || '');
          return message.includes('already responding');
        };
        const payload = {
          content: [{ type: 'input_text', text: ' ' }],
          attachments: [],
        };
        try {
          const result = chatkitEl.sendUserMessage(payload);
          if (result && typeof result.catch === 'function') {
            result.catch((err) => {
              if (ignoreAlreadyResponding(err)) return;
              setStatus(`Auto-start failed: ${err?.message || err}`, 'error');
            });
          }
        } catch (err) {
          if (ignoreAlreadyResponding(err)) return;
          setStatus(`Auto-start failed: ${err?.message || err}`, 'error');
        }
      }

      applyBtn.addEventListener('click', () => {
        void connect();
      });

      chatkitEl.addEventListener('chatkit.error', (event) => {
        const message = event?.detail?.error?.message || 'ChatKit error';
        setStatus(message, 'error');
      });

      chatkitEl.addEventListener('chatkit.thread.change', (event) => {
        const threadId = event?.detail?.threadId;
        if (threadId) {
          setStatus(`Thread ${threadId} active`, 'ok');
          triggerAutoStart();
        }
      });

      if (autoConnectSelect.value === '1' && (workflowIdInput.value.trim() || projectIdInput.value.trim())) {
        void connect();
      }
    </script>
  </body>
</html>
